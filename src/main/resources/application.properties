server.address=0.0.0.0
server.port=3000
star-trader.email.resend.api-key=${RESEND_API_KEY:}
star-trader.email.resend.from=${RESEND_FROM_ADDRESS:}
# Blank endpoint override = real AWS (standard credential chain); bootRun sets it to DynamoDB Local.
star-trader.dynamodb.endpoint-override=${DYNAMODB_ENDPOINT_OVERRIDE:}
star-trader.dynamodb.table-name=${DYNAMODB_TABLE_NAME:star-trader-games}
star-trader.dynamodb.region=${AWS_REGION:eu-central-1}
