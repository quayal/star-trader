server.address=0.0.0.0
server.port=3000
star-trader.email.resend.api-key=${RESEND_API_KEY:}
star-trader.email.resend.from=${RESEND_FROM_ADDRESS:}
# Blank endpoint override = real AWS (standard credential chain); bootRun sets it to DynamoDB Local.
star-trader.dynamodb.endpoint-override=${DYNAMODB_ENDPOINT_OVERRIDE:}
star-trader.dynamodb.table-name=${DYNAMODB_TABLE_NAME:star-trader-games}
star-trader.dynamodb.region=${AWS_REGION:eu-central-1}
# Browsers must revalidate static files (a cheap 304 when unchanged) instead of guessing how long a cached copy
# stays fresh: without it, Safari and Firefox kept an old components.css after a change (lessons 2026-11-02).
spring.web.resources.cache.cachecontrol.no-cache=true
# Compress JSON, HTML, CSS and JS over the wire: a game poll drops from ~6.8 KB to ~1.7 KB and index.html from 219 KB
# to ~51 KB, which matters for remote players over a metered tunnel (creator, 2026-11-18).
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,text/javascript,application/javascript,text/plain
