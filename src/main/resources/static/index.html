<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Star Trader &mdash; Command Deck</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #0b0e17;
			--panel: #141a2a;
			--border: #26314a;
			--text: #e6ebf5;
			--muted: #8a93a8;
			--accent: #5fb3ff;
			--buy: #4fd48c;
			--sell: #ff8a65;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			background: var(--bg);
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			display: grid;
			grid-template-columns: 220px 1fr;
			grid-template-rows: auto 1fr;
			grid-template-areas: "sidebar topbar" "sidebar main";
		}
		.sidebar {
			grid-area: sidebar;
			background: var(--panel);
			border-right: 1px solid var(--border);
			padding: 1.5rem 1rem;
			display: flex;
			flex-direction: column;
			gap: 0.3rem;
		}
		.brand { font-weight: 700; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 1.5rem; }
		.nav-item {
			display: block;
			padding: 0.6rem 0.8rem;
			border-radius: 8px;
			color: var(--muted);
			text-decoration: none;
			font-size: 0.9rem;
		}
		.nav-item:hover { background: #0f1424; color: var(--text); }
		.nav-item.active { background: #0f1424; color: var(--text); font-weight: 600; }
		.topbar {
			grid-area: topbar;
			border-bottom: 1px solid var(--border);
			padding: 1.5rem 2rem;
		}
		.topbar h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
		.topbar p { color: var(--muted); margin: 0; font-size: 0.9rem; }
		main { grid-area: main; padding: 2rem; }
		.panel {
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 12px;
			padding: 1.5rem;
		}
		.panel h2 { margin-top: 0; font-size: 1.1rem; }
		.market-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
			gap: 1rem;
		}
		.system-card {
			border: 1px solid var(--border);
			border-radius: 10px;
			padding: 1rem;
			background: #0f1424;
		}
		.system-card h3 { margin: 0 0 0.6rem; font-size: 1rem; }
		.goods-row {
			display: flex;
			justify-content: space-between;
			font-size: 0.85rem;
			padding: 0.3rem 0;
			border-bottom: 1px solid var(--border);
		}
		.goods-row:last-child { border-bottom: none; }
		.goods-name { color: var(--muted); }
		.empty { color: var(--muted); font-size: 0.9rem; }
	</style>
</head>
<body>
<aside class="sidebar">
	<div class="brand">STAR TRADER</div>
	<a class="nav-item active" href="index.html">Deck</a>
	<a class="nav-item" href="trade-offers.html">Market</a>
</aside>

<header class="topbar">
	<h1>Command Deck</h1>
	<p>Live prices and supply/demand across all six star systems.</p>
</header>

<main>
	<section class="panel">
		<h2>Market Overview</h2>
		<div id="market-grid" class="market-grid">
			<p class="empty">Loading market&hellip;</p>
		</div>
	</section>
</main>

<script>
	async function loadMarket() {
		const grid = document.getElementById('market-grid');
		const response = await fetch('/api/options');
		const options = await response.json();

		grid.innerHTML = options.starSystems
			.map(system => `
				<div class="system-card">
					<h3>${system.displayName}</h3>
					${system.market
						.map(m => `
							<div class="goods-row">
								<span class="goods-name">${m.goods}</span>
								<span>${m.price} CR &middot; S/D ${m.indicator > 0 ? '+' : ''}${m.indicator}</span>
							</div>
						`)
						.join('')}
				</div>
			`)
			.join('');
	}

	loadMarket();
</script>
</body>
</html>
