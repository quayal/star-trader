<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Star Trader &mdash; Command Deck</title>
	<link rel="stylesheet" href="css/fonts.css">
	<link rel="stylesheet" href="css/tokens.css">
	<link rel="stylesheet" href="css/components.css">
	<style>
		body {
			min-height: 100vh;
			display: grid;
			grid-template-columns: 220px 1fr;
			grid-template-rows: auto 1fr;
			grid-template-areas: "sidebar topbar" "sidebar main";
		}
		.sidebar {
			grid-area: sidebar;
			background: var(--surface-panel);
			border-right: var(--border-width) solid var(--border-subtle);
			padding: var(--space-between-groups) var(--space-panel);
			display: flex;
			flex-direction: column;
			gap: var(--space-hairline);
		}
		.brand {
			font-family: var(--font-display);
			font-weight: 700;
			letter-spacing: 0.08em;
			color: var(--accent-selected);
			margin-bottom: var(--space-between-groups);
		}
		.topbar {
			grid-area: topbar;
			border-bottom: var(--border-width) solid var(--border-subtle);
			padding: var(--space-between-groups) var(--space-section);
		}
		.topbar h1 { font-size: var(--text-heading); margin-bottom: var(--space-hairline); }
		.topbar p { color: var(--text-muted); margin: 0; }
		main { grid-area: main; padding: var(--space-section); }
		.panel h2 { font-size: var(--text-title); margin-bottom: var(--space-panel); }
		.market-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
			gap: var(--space-panel);
		}
		.system-card {
			border: var(--border-width) solid var(--border-subtle);
			border-radius: var(--radius-panel);
			padding: var(--space-panel);
			background: var(--surface-page);
		}
		.system-card h3 { font-size: var(--text-value); margin-bottom: var(--space-related); }
		.goods-row {
			display: flex;
			justify-content: space-between;
			font-size: var(--text-value);
			padding: var(--space-hairline) 0;
			border-bottom: var(--border-width) solid var(--border-subtle);
		}
		.goods-row:last-child { border-bottom: none; }
		.goods-name { color: var(--text-muted); }
	</style>
</head>
<body>
<aside class="sidebar">
	<div class="brand">STAR TRADER</div>
	<a class="nav-item" aria-current="page" href="index.html">Deck</a>
	<a class="nav-item" href="trade-offers.html">Market</a>
</aside>

<header class="topbar">
	<h1>Command Deck</h1>
	<p>Live prices and supply/demand across all six star systems.</p>
</header>

<main>
	<section class="panel">
		<h2>Market Overview</h2>
		<div id="market-grid" class="market-grid">
			<p class="empty">Loading market&hellip;</p>
		</div>
	</section>
</main>

<script>
	async function loadMarket() {
		const grid = document.getElementById('market-grid');
		const response = await fetch('/api/options');
		const options = await response.json();

		grid.innerHTML = options.starSystems
			.map(system => `
				<div class="system-card">
					<h3>${system.displayName}</h3>
					${system.market
						.map(m => `
							<div class="goods-row">
								<span class="goods-name">${m.goods}</span>
								<span>${m.price} HT &middot; S/D ${m.indicator > 0 ? '+' : ''}${m.indicator}</span>
							</div>
						`)
						.join('')}
				</div>
			`)
			.join('');
	}

</script>
<script type="module">
	import { requireSession } from './js/session.js';

	// Signed out, or the server no longer knows the session: sign in (s10), then come back (E01-S03).
	if (await requireSession()) {
		loadMarket();
	}
</script>
</body>
</html>
