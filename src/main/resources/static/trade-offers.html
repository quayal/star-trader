<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Star Trader &mdash; Trade Offers</title>
	<link rel="stylesheet" href="css/fonts.css">
	<link rel="stylesheet" href="css/tokens.css">
	<link rel="stylesheet" href="css/components.css">
	<style>
		body {
			min-height: 100vh;
			display: flex;
			justify-content: center;
			padding: var(--space-section) var(--space-panel);
		}
		main { width: 100%; max-width: 640px; }
		h1 { font-size: var(--text-heading); margin: var(--space-panel) 0 var(--space-hairline); }
		h2 { font-size: var(--text-title); margin-bottom: var(--space-panel); }
		p.subtitle { color: var(--text-muted); margin: 0 0 var(--space-between-groups); }
		.panel { margin-bottom: var(--space-between-groups); }
		.field-label { margin-top: var(--space-panel); }
		form > .field-label:first-child { margin-top: 0; }
		.offer-type-toggle { display: flex; gap: var(--space-group); }
		.offer-type-toggle .choice { flex: 1; }
		form .btn { margin-top: var(--space-between-groups); width: 100%; }
		.message { margin-top: var(--space-panel); }
	</style>
</head>
<body>
<main>
	<a class="link" href="index.html">&larr; Back to Deck</a>
	<h1>Submit a Trade Offer</h1>
	<p class="subtitle">Pick a star system, then only the goods it actually trades, a price from 1&ndash;20, and buy or sell.</p>

	<form id="offer-form" class="panel">
		<label class="field-label" for="playerName">Player name</label>
		<input class="control" id="playerName" name="playerName" type="text" maxlength="40" required placeholder="Adrian">

		<label class="field-label" for="system">Star system</label>
		<select class="control" id="system" name="system" required></select>

		<label class="field-label" for="goods">Goods</label>
		<select class="control" id="goods" name="goods" required></select>

		<label class="field-label" for="price">Price</label>
		<select class="control" id="price" name="price" required></select>

		<span class="field-label" id="offerTypeLabel">Offer type</span>
		<div class="offer-type-toggle" id="offerType" role="radiogroup" aria-labelledby="offerTypeLabel"></div>

		<button class="btn" type="submit">Submit offer</button>
		<div id="message" class="message" role="status"></div>
	</form>

	<section class="panel">
		<h2>Submitted offers</h2>
		<div id="offers-table"></div>
	</section>
</main>

<script>
	let options = null;

	const systemSelect = document.getElementById('system');
	const goodsSelect = document.getElementById('goods');
	const priceSelect = document.getElementById('price');
	const offerTypeContainer = document.getElementById('offerType');
	const form = document.getElementById('offer-form');
	const messageEl = document.getElementById('message');
	const offersTable = document.getElementById('offers-table');

	async function loadOptions() {
		const response = await fetch('/api/options');
		options = await response.json();

		systemSelect.innerHTML = options.starSystems
			.map(s => `<option value="${s.name}">${s.displayName}</option>`)
			.join('');

		priceSelect.innerHTML = '';
		for (let price = options.minPrice; price <= options.maxPrice; price++) {
			const opt = document.createElement('option');
			opt.value = String(price);
			opt.textContent = String(price);
			priceSelect.appendChild(opt);
		}

		offerTypeContainer.innerHTML = options.offerTypes
			.map((type, i) => `
				<label class="choice">
					<input type="radio" name="offerType" value="${type}" ${i === 0 ? 'checked' : ''}>
					${type}
				</label>
			`)
			.join('');

		populateGoods();
	}

	function populateGoods() {
		const system = options.starSystems.find(s => s.name === systemSelect.value);
		const goods = system ? system.goods : [];
		goodsSelect.innerHTML = goods.map(g => `<option value="${g}">${g}</option>`).join('');
	}

	systemSelect.addEventListener('change', populateGoods);

	function renderOffers(offers) {
		if (!offers.length) {
			offersTable.innerHTML = '<p class="empty">No offers submitted yet.</p>';
			return;
		}
		const rows = offers
			.slice()
			.reverse()
			.map(o => `
				<tr>
					<td>${o.playerName}</td>
					<td>${o.systemDisplayName}</td>
					<td>${o.goods}</td>
					<td class="num">${o.price}</td>
					<td class="trade trade--${o.offerType.toLowerCase()}">${o.offerType}</td>
				</tr>
			`)
			.join('');
		offersTable.innerHTML = `
			<table class="data-table">
				<thead>
					<tr><th>Player</th><th>System</th><th>Goods</th><th class="num">Price</th><th>Type</th></tr>
				</thead>
				<tbody>${rows}</tbody>
			</table>
		`;
	}

	async function loadOffers() {
		const response = await fetch('/api/trade-offers');
		renderOffers(await response.json());
	}

	function showMessage(text, isError) {
		messageEl.textContent = text;
		messageEl.className = isError ? 'message message--error' : 'message message--success';
	}

	form.addEventListener('submit', async (event) => {
		event.preventDefault();
		const formData = new FormData(form);
		const payload = {
			playerName: formData.get('playerName'),
			system: formData.get('system'),
			goods: formData.get('goods'),
			offerType: formData.get('offerType'),
			price: Number(formData.get('price')),
		};

		const submitButton = form.querySelector('button');
		submitButton.disabled = true;
		try {
			const response = await fetch('/api/trade-offers', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify(payload),
			});
			if (!response.ok) {
				const problem = await response.text();
				throw new Error(problem || `Request failed with status ${response.status}`);
			}
			showMessage('Offer submitted.', false);
			await loadOffers();
		} catch (err) {
			showMessage(err.message, true);
		} finally {
			submitButton.disabled = false;
		}
	});

	(async function init() {
		await loadOptions();
		await loadOffers();
	})();
</script>
</body>
</html>
